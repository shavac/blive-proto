[package]
name = "blive-proto"
version = "0.1.0"
edition = "2024"
description = "Bilibili live room danmaku WebSocket, Protobuf, command, and authentication protocol library"
license = "MIT"
readme = "README.md"
repository = "https://github.com/shavac/blive-proto"
keywords = ["bilibili", "live", "danmaku", "protobuf", "websocket"]
categories = ["network-programming", "parser-implementations"]
exclude = ["design/", ".github/"]

[lib]
name = "blive_proto"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
brotlic = "0.8.1"
chrono = "0.4.45"
clru = "0.6.3"
flate2 = "1.1.11"
futures-channel = "0.3.28"
http = "0.2.11"
log = "0.4"
md5 = "0.7"
native-tls = "0.2.0"
prost = "0.13"
regex = "1.13.1"
reqwest = { version = "0.11.17", default-features = false, features = [
    "blocking",
    "cookies",
    "rustls-tls",
    "json",
    "stream",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tungstenite = "0.20.1"
url = "2.3.1"

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"
